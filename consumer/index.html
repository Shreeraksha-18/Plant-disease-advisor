<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Plant Disease Advisor</title>
  <style>
    :root {
      --g900: #14532d; --g800: #166534; --g700: #15803d; --g600: #16a34a;
      --g400: #4ade80; --g200: #bbf7d0; --g100: #dcfce7; --g50: #f0fdf4;
      --teal: #0d9488; --teal-dark: #0f766e; --teal-light: #ccfbf1;
      --ink: #1f2933; --muted: #6b7785; --line: #e3e8ee; --card: #ffffff;
      --amber: #b45309; --amber-bg: #fff4e0; --amber-line: #f6d9a8;
      --red: #b3261e; --red-bg: #fdecea;
      --shadow: 0 2px 8px rgba(16,24,40,.08), 0 8px 24px rgba(16,24,40,.06);
      --shadow-lg: 0 4px 16px rgba(16,24,40,.12), 0 16px 48px rgba(16,24,40,.08);
      --grad-main: linear-gradient(135deg, #14532d 0%, #0d9488 100%);
      --grad-btn: linear-gradient(135deg, #16a34a 0%, #0d9488 100%);
      --grad-bg: linear-gradient(160deg, #f0fdf4 0%, #ccfbf1 50%, #e0f2fe 100%);
      --grad-card: linear-gradient(145deg, #ffffff 0%, #f0fdf4 100%);
      --grad-bubble-bot: linear-gradient(135deg, #ffffff 0%, #f0fdf4 100%);
      --grad-tile: linear-gradient(135deg, #f0fdf4 0%, #ccfbf1 100%);
      --grad-sidebar: linear-gradient(180deg, #f8fffc 0%, #f0fdf4 100%);
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    html, body { height: 100%; }
    body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
           background: var(--grad-bg); color: var(--ink); line-height: 1.5; }
    h1, h2, h3, h4, p { margin: 0; }
    .muted { color: var(--muted); font-size: 14px; }

    /* ---------- header ---------- */
    header { height: 62px; display: flex; align-items: center; justify-content: space-between; padding: 0 24px;
             background: var(--grad-main); color: #fff; position: sticky; top: 0; z-index: 20;
             box-shadow: 0 2px 12px rgba(14,53,29,.3); }
    .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 18px; letter-spacing: .2px; }
    .brand .logo { width: 36px; height: 36px; border-radius: 12px; background: rgba(255,255,255,.18);
                   display: grid; place-items: center; font-size: 22px; }
    .head-right { display: flex; align-items: center; gap: 12px; }
    .chip { display: flex; align-items: center; gap: 8px; background: rgba(255,255,255,.15); padding: 5px 12px 5px 6px;
            border-radius: 999px; font-size: 14px; border: 1px solid rgba(255,255,255,.2); }
    .avatar { width: 28px; height: 28px; border-radius: 50%;
              background: linear-gradient(135deg, #4ade80, #2dd4bf); color: #14532d;
              display: grid; place-items: center; font-weight: 700; font-size: 13px; }
    .hbtn { background: rgba(255,255,255,.16); color: #fff; border: 1px solid rgba(255,255,255,.2);
            padding: 7px 14px; border-radius: 8px; cursor: pointer; font-size: 14px; transition: .15s; }
    .hbtn:hover { background: rgba(255,255,255,.28); }

    /* ---------- login ---------- */
    #loginView { min-height: calc(100vh - 62px); display: grid; place-items: center; padding: 20px; }
    .auth-card { width: 100%; max-width: 420px; background: var(--grad-card); border-radius: 24px;
                 box-shadow: var(--shadow-lg); padding: 32px; border: 1px solid var(--g200); }
    .auth-card .hero { font-size: 48px; text-align: center; margin-bottom: 4px; }
    .auth-card h2 { text-align: center; margin: 6px 0 2px; color: var(--g900); font-size: 24px; }
    .auth-card .muted { text-align: center; display: block; margin-bottom: 20px; }
    .tabs { display: flex; background: var(--g50); border-radius: 12px; padding: 4px; margin-bottom: 18px;
            border: 1px solid var(--g200); }
    .tabs button { flex: 1; border: 0; background: transparent; padding: 9px; border-radius: 9px;
                   cursor: pointer; font-weight: 600; color: var(--muted); transition: .15s; }
    .tabs button.on { background: var(--grad-btn); color: #fff; box-shadow: 0 2px 8px rgba(22,163,74,.3); }
    .field { margin-bottom: 14px; }
    .field label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 5px; font-weight: 500; }
    .field input { width: 100%; padding: 12px 14px; border: 1.5px solid var(--line); border-radius: 12px; font-size: 15px;
                   background: #fafffe; transition: .15s; }
    .field input:focus { outline: none; border-color: var(--g600); box-shadow: 0 0 0 3px rgba(22,163,74,.12); }
    .btn { background: var(--grad-btn); color: #fff; border: 0; padding: 12px 20px; border-radius: 12px;
           cursor: pointer; font-size: 15px; font-weight: 600; transition: .15s;
           box-shadow: 0 2px 8px rgba(22,163,74,.3); }
    .btn:hover { filter: brightness(1.08); box-shadow: 0 4px 16px rgba(22,163,74,.4); transform: translateY(-1px); }
    .btn:disabled { background: linear-gradient(135deg, #b8c4bc, #a0b4b4); cursor: not-allowed;
                    box-shadow: none; transform: none; filter: none; }
    .btn.full { width: 100%; }
    .btn.ghost { background: transparent; color: var(--muted); border: 1.5px solid var(--line);
                 font-weight: 500; padding: 7px 14px; font-size: 14px; box-shadow: none; }
    .btn.ghost:hover { color: var(--g700); border-color: var(--g400); background: var(--g50);
                       transform: none; box-shadow: none; filter: none; }
    .btn.ghost.danger:hover { color: var(--red); border-color: var(--red); background: var(--red-bg); }
    .btn.support-btn { background: linear-gradient(135deg, #0d9488, #0369a1); font-size: 14px;
                       padding: 9px 16px; margin-top: 14px; box-shadow: 0 2px 8px rgba(13,148,136,.3); }
    .alert { padding: 12px 14px; border-radius: 12px; font-size: 14px; margin-top: 12px; }
    .alert.err { background: var(--red-bg); color: var(--red); border: 1px solid #f5c6c4; }
    .alert.ok { background: var(--g100); color: var(--g800); border: 1px solid var(--g200); }
    .alert.warn { background: var(--amber-bg); color: var(--amber); border: 1px solid var(--amber-line); }

    /* ---------- app layout ---------- */
    #appView { display: grid; grid-template-columns: 310px 1fr; height: calc(100vh - 62px); }
    aside { background: var(--grad-sidebar); border-right: 1px solid var(--g200);
            display: flex; flex-direction: column; min-height: 0; }
    .side-top { padding: 14px; border-bottom: 1px solid var(--g200); }
    .side-title { padding: 12px 16px 6px; font-size: 11px; text-transform: uppercase;
                  letter-spacing: 1px; color: var(--muted); font-weight: 600; }
    #histList { overflow-y: auto; padding: 4px 8px 12px; flex: 1; }
    .hist { display: flex; align-items: center; gap: 8px; padding: 10px; border-radius: 14px;
            cursor: pointer; border: 1px solid transparent; transition: .15s; }
    .hist:hover { background: var(--g100); border-color: var(--g200); }
    .hist.active { background: linear-gradient(135deg, var(--g100), var(--teal-light));
                   border-color: var(--g200); box-shadow: 0 2px 8px rgba(22,163,74,.1); }
    .hist-main { flex: 1; min-width: 0; }
    .hist-title { font-weight: 600; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .hist-sub { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .badge { font-size: 11px; font-weight: 700; padding: 3px 9px; border-radius: 999px; }
    .badge.hi { background: linear-gradient(135deg, #d7f0df, #ccfbf1); color: #14673a; }
    .badge.mid { background: #fdf0c8; color: #8a6100; }
    .badge.lo { background: var(--amber-bg); color: var(--amber); }
    .del { border: 0; background: transparent; cursor: pointer; opacity: 0; font-size: 15px;
           padding: 4px; border-radius: 6px; transition: .15s; }
    .hist:hover .del, .hist.active .del { opacity: .7; }
    .del:hover { opacity: 1 !important; background: var(--red-bg); }
    .empty { text-align: center; color: var(--muted); font-size: 14px; padding: 30px 14px; }

    main { overflow-y: auto; padding: 24px; min-width: 0; }

    /* ---------- new diagnosis panel ---------- */
    .panel { max-width: 680px; margin: 0 auto; background: var(--grad-card); border-radius: 24px;
             box-shadow: var(--shadow-lg); border: 1px solid var(--g200); padding: 28px; }
    .panel h2 { color: var(--g900); margin-bottom: 4px; font-size: 22px; }
    .drop { display: grid; place-items: center; text-align: center; margin: 20px 0; min-height: 200px;
            border: 2px dashed var(--g200); border-radius: 18px;
            background: linear-gradient(135deg, var(--g50), var(--teal-light));
            cursor: pointer; padding: 20px; transition: .2s; }
    .drop:hover, .drop.over { border-color: var(--g600);
                               background: linear-gradient(135deg, var(--g100), var(--teal-light)); }
    .drop-icon { font-size: 40px; margin-bottom: 8px; }
    .drop span { color: var(--muted); font-size: 14px; display: block; }
    .pv { max-width: 100%; max-height: 260px; border-radius: 14px; display: block; margin: 0 auto 8px; }
    .typing { margin-top: 14px; color: var(--muted); font-size: 14px; display: flex; align-items: center; gap: 8px; }
    .dots { display: inline-flex; gap: 4px; }
    .dots span { width: 7px; height: 7px; border-radius: 50%; background: var(--g600);
                 animation: bounce 1.2s infinite; display: inline-block; }
    .dots span:nth-child(2) { animation-delay: .2s; }
    .dots span:nth-child(3) { animation-delay: .4s; }
    @keyframes bounce { 0%, 80%, 100% { transform: scale(.6); opacity: .4; } 40% { transform: scale(1); opacity: 1; } }

    /* ---------- chat view ---------- */
    .wrap { max-width: 780px; margin: 0 auto; }
    .chat-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 20px; }
    .chat-head h2 { color: var(--g900); font-size: 21px; }
    .chat { display: flex; flex-direction: column; gap: 16px; }
    .msg { display: flex; gap: 10px; align-items: flex-start; }
    .msg.user { justify-content: flex-end; }
    .bot-av { width: 38px; height: 38px; border-radius: 50%;
              background: var(--grad-btn); color: #fff;
              display: grid; place-items: center; flex: none; font-size: 18px;
              box-shadow: 0 2px 8px rgba(22,163,74,.3); }
    .bubble { border-radius: 20px; padding: 14px 18px; max-width: 100%; }
    .bubble.me { background: linear-gradient(135deg, #dcfce7, #ccfbf1);
                 border: 1px solid var(--g200); border-bottom-right-radius: 6px;
                 max-width: 340px; box-shadow: 0 2px 8px rgba(22,163,74,.1); }
    .bubble.bot { background: var(--grad-bubble-bot); border: 1px solid var(--g200);
                  border-top-left-radius: 6px; box-shadow: var(--shadow); flex: 1; min-width: 0; }
    .bubble.support { background: linear-gradient(135deg, #f0fdfa, #e0f2fe);
                      border-color: #a7f3d0; }
    .thumb { width: 100%; max-height: 220px; object-fit: cover; border-radius: 12px; display: block; margin-bottom: 8px; }
    .thumb.ph { height: 100px; background: var(--grad-tile); display: grid; place-items: center;
                text-align: center; color: var(--muted); font-size: 13px; border-radius: 12px; }
    .thumb.ph span { display: block; }
    .cap { font-size: 13px; color: var(--g700); font-weight: 600; }
    .crop { font-size: 12px; text-transform: uppercase; letter-spacing: 1px; color: var(--teal); font-weight: 600; }
    .dname { font-size: 23px; font-weight: 700;
             background: var(--grad-main); -webkit-background-clip: text; -webkit-text-fill-color: transparent;
             background-clip: text; margin: 4px 0 12px; }
    .conf { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; font-size: 13px; color: var(--muted); }
    .conf-bar { flex: 1; height: 8px; background: #e8f5e9; border-radius: 999px; overflow: hidden; max-width: 240px; }
    .conf-bar i { display: block; height: 100%; border-radius: 999px; }
    .conf-bar i.hi { background: linear-gradient(90deg, #16a34a, #0d9488); }
    .conf-bar i.mid { background: linear-gradient(90deg, #e0a800, #f59e0b); }
    .conf-bar i.lo { background: linear-gradient(90deg, #e07b00, #dc2626); }
    .summary { font-size: 15px; margin-bottom: 16px; line-height: 1.6; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 10px; margin-bottom: 4px; }
    .tile { background: var(--grad-tile); border: 1px solid var(--g200); border-radius: 14px; padding: 14px 16px; }
    .tile h4 { font-size: 13px; color: var(--teal-dark); margin-bottom: 8px; font-weight: 700; }
    .tile ul { margin: 0; padding-left: 18px; font-size: 14px; }
    .tile li { margin-bottom: 4px; }
    .src, .note { font-size: 12px; color: var(--muted); margin-top: 12px; }
    .disclaimer { text-align: center; font-size: 12px; color: var(--muted); margin: 20px 0 6px; }

    /* ---------- support panel ---------- */
    .store-list { display: flex; flex-direction: column; gap: 10px; margin-top: 10px; }
    .store-item { display: flex; align-items: flex-start; gap: 12px; padding: 12px 14px;
                  background: rgba(255,255,255,.7); border-radius: 12px; border: 1px solid var(--g200); }
    .store-icon { font-size: 22px; flex: none; margin-top: 2px; }
    .store-name { font-weight: 600; font-size: 15px; }
    .store-name a { color: var(--teal-dark); text-decoration: none; }
    .store-name a:hover { text-decoration: underline; }
    .store-note { font-size: 13px; color: var(--muted); margin-top: 2px; }
    .store-type-badge { font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 999px;
                        display: inline-block; margin-bottom: 3px; }
    .store-type-badge.online { background: #dbeafe; color: #1d4ed8; }
    .store-type-badge.gov { background: var(--g100); color: var(--g800); }
    .store-type-badge.local { background: var(--amber-bg); color: var(--amber); }
    .helpline { margin-top: 14px; padding: 12px 14px; background: linear-gradient(135deg, var(--g100), var(--teal-light));
                border-radius: 12px; border: 1px solid var(--g200); font-weight: 600; color: var(--g800); font-size: 14px; }
    .products-row { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0; }
    .product-tag { background: linear-gradient(135deg, var(--g100), var(--teal-light));
                   border: 1px solid var(--g200); border-radius: 999px; padding: 4px 12px;
                   font-size: 13px; color: var(--g800); font-weight: 500; }

    /* ---------- chat input ---------- */
    .chat-input-area { max-width: 780px; margin: 20px auto 0; }
    .chat-input-box { display: flex; gap: 10px; align-items: flex-end; background: var(--grad-card);
                      border: 1.5px solid var(--g200); border-radius: 20px; padding: 10px 10px 10px 16px;
                      box-shadow: var(--shadow); }
    .chat-input-box textarea { flex: 1; border: 0; background: transparent; resize: none; font-size: 15px;
                                font-family: inherit; line-height: 1.5; max-height: 120px; outline: none;
                                color: var(--ink); min-height: 24px; }
    .chat-send-btn { background: var(--grad-btn); color: #fff; border: 0; border-radius: 14px; width: 42px; height: 42px;
                     cursor: pointer; font-size: 18px; display: grid; place-items: center; flex: none; transition: .15s;
                     box-shadow: 0 2px 8px rgba(22,163,74,.3); }
    .chat-send-btn:hover { filter: brightness(1.1); transform: scale(1.05); }
    .chat-send-btn:disabled { background: linear-gradient(135deg, #b8c4bc, #a0b4b4); cursor: not-allowed;
                               transform: none; filter: none; box-shadow: none; }
    .chat-hint { font-size: 12px; color: var(--muted); margin-top: 8px; text-align: center; }

    @media (max-width: 820px) {
      #appView { grid-template-columns: 1fr; grid-template-rows: auto 1fr; height: auto; min-height: calc(100vh - 62px); }
      aside { max-height: 36vh; border-right: 0; border-bottom: 1px solid var(--g200); }
      main { padding: 14px; overflow: visible; }
      .del { opacity: .6; }
      .chip span.nm { display: none; }
    }
  </style>
</head>
<body>
  <header>
    <div class="brand"><div class="logo">🌿</div> Plant Disease Advisor</div>
    <div class="head-right">
      <div class="chip" id="userChip" hidden><div class="avatar" id="avatar">?</div><span class="nm" id="userName"></span></div>
      <button class="hbtn" id="logoutBtn" hidden>Log out</button>
    </div>
  </header>

  <!-- ===== login / register ===== -->
  <section id="loginView">
    <div class="auth-card">
      <div class="hero">🍃</div>
      <h2>Welcome</h2>
      <span class="muted">Diagnose plant leaf diseases from a photo</span>
      <div class="tabs">
        <button type="button" id="tabLogin" class="on">Log in</button>
        <button type="button" id="tabReg">Register</button>
      </div>
      <form id="authForm">
        <div class="field"><label for="username">Username</label><input id="username" autocomplete="username" required minlength="3"></div>
        <div class="field"><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required minlength="8"></div>
        <button class="btn full" id="authBtn" type="submit">Log in</button>
        <div id="authMsg"></div>
      </form>
    </div>
  </section>

  <!-- ===== app ===== -->
  <section id="appView" hidden>
    <aside>
      <div class="side-top"><button class="btn full" id="newBtn">＋ New diagnosis</button></div>
      <div class="side-title">History</div>
      <div id="histList"></div>
    </aside>
    <main id="main"></main>
  </section>

  <script>
    let token = sessionStorage.getItem("token");
    let activeId = null;
    let mode = "login";
    const thumbs = {};

    const $ = id => document.getElementById(id);
    // API base URL — if not on localhost, use /api (for deployed environments)
    let _apiUrl = "http://127.0.0.1:8000";
    if (location.protocol.startsWith("http") && !["127.0.0.1","localhost"].includes(location.hostname)) {
      _apiUrl = "/api";
    }
    const base = () => _apiUrl;
    const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

    function parseLabel(label) {
      const [c, d] = label.split("___");
      const clean = s => (s || "").replace(/_/g, " ").replace(/\s+/g, " ").trim();
      let disease = clean(d);
      if (/^healthy$/i.test(disease)) disease = "Healthy ✅";
      return { crop: clean(c), disease };
    }
    function toDate(s) { return new Date(/(Z|[+-]\d\d:?\d\d)$/i.test(s) ? s : s + "Z"); }
    function fmt(s) { return toDate(s).toLocaleString([], { day: "numeric", month: "short", hour: "numeric", minute: "2-digit" }); }
    function confClass(c) { return c >= 0.9 ? "hi" : c >= 0.7 ? "mid" : "lo"; }

    async function api(path, options = {}) {
      const headers = options.headers || {};
      if (token) headers["Authorization"] = "Bearer " + token;
      const res = await fetch(base() + path, { ...options, headers });
      if (res.status === 401 && token && !path.startsWith("/auth/login")) {
        logout();
        throw new Error("Session expired, please log in again");
      }
      if (res.status === 204) return null;
      const data = await res.json().catch(() => ({}));
      if (!res.ok) {
        let msg = "Request failed (" + res.status + ")";
        if (typeof data.detail === "string") msg = data.detail;
        else if (Array.isArray(data.detail)) msg = data.detail.map(d => d.msg).join("; ");
        throw new Error(msg);
      }
      return data;
    }

    /* ---------- auth ---------- */
    function setView(v) {
      $("loginView").hidden = v !== "login";
      $("appView").hidden = v !== "app";
      $("userChip").hidden = v !== "app";
      $("logoutBtn").hidden = v !== "app";
    }
    function setMode(m) {
      mode = m;
      $("tabLogin").classList.toggle("on", m === "login");
      $("tabReg").classList.toggle("on", m === "register");
      $("authBtn").textContent = m === "login" ? "Log in" : "Create account";
      $("password").autocomplete = m === "login" ? "current-password" : "new-password";
      $("authMsg").innerHTML = "";
    }
    $("tabLogin").onclick = () => setMode("login");
    $("tabReg").onclick = () => setMode("register");

    $("authForm").addEventListener("submit", async (ev) => {
      ev.preventDefault();
      const msg = $("authMsg"), btn = $("authBtn");
      const u = $("username").value, p = $("password").value;
      btn.disabled = true;
      msg.innerHTML = "";
      try {
        if (mode === "register") {
          await api("/auth/register", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ username: u, password: p })
          });
        }
        token = null;
        const data = await api("/auth/login", { method: "POST", body: new URLSearchParams({ username: u, password: p }) });
        token = data.access_token;
        sessionStorage.setItem("token", token);
        const me = await api("/auth/me");
        $("password").value = "";
        await enterApp(me.username);
      } catch (e) {
        msg.innerHTML = '<div class="alert err">' + esc(e.message) + "</div>";
      } finally { btn.disabled = false; }
    });

    function logout() {
      token = null; activeId = null;
      sessionStorage.removeItem("token");
      $("histList").innerHTML = "";
      $("main").innerHTML = "";
      setView("login");
    }
    $("logoutBtn").onclick = logout;

    async function enterApp(username) {
      setView("app");
      $("userName").textContent = username;
      $("avatar").textContent = username.charAt(0).toUpperCase();
      openNew();
      await loadHistory();
    }

    /* ---------- history sidebar ---------- */
    async function loadHistory() {
      const box = $("histList");
      try {
        const rows = await api("/predictions?limit=100");
        if (!rows.length) {
          box.innerHTML = '<div class="empty">No diagnoses yet.<br>Upload your first leaf photo.</div>';
          return;
        }
        box.innerHTML = rows.map(r => {
          const p = parseLabel(r.disease);
          const unsure = r.status === "uncertain";
          const cls = unsure ? "lo" : confClass(r.confidence);
          return `<div class="hist ${r.id === activeId ? "active" : ""}" data-id="${r.id}">
              <div class="hist-main">
                <div class="hist-title">${esc(unsure ? "Unclear photo" : p.disease)}</div>
                <div class="hist-sub">${esc(unsure ? "Guess: " + p.disease : p.crop)} · ${esc(fmt(r.created_at))}</div>
              </div>
              <span class="badge ${cls}">${Math.round(r.confidence * 100)}%</span>
              <button class="del" data-del="${r.id}" title="Delete" aria-label="Delete">🗑</button>
            </div>`;
        }).join("");
      } catch (e) {
        box.innerHTML = '<div class="empty" style="color:var(--red)">' + esc(e.message) + "</div>";
      }
    }
    function markActive() {
      document.querySelectorAll(".hist").forEach(el => el.classList.toggle("active", Number(el.dataset.id) === activeId));
    }

    $("histList").addEventListener("click", (ev) => {
      const del = ev.target.closest("[data-del]");
      if (del) { ev.stopPropagation(); deleteRecord(Number(del.dataset.del)); return; }
      const item = ev.target.closest(".hist");
      if (item) openRecord(Number(item.dataset.id));
    });
    $("newBtn").onclick = openNew;

    async function deleteRecord(id) {
      if (!confirm("Delete diagnosis #" + id + "? This cannot be undone.")) return;
      try {
        await api("/predictions/" + id, { method: "DELETE" });
        delete thumbs[id];
        if (activeId === id) openNew();
        await loadHistory();
      } catch (e) { alert(e.message); }
    }

    /* ---------- new diagnosis view ---------- */
    function openNew() {
      activeId = null;
      markActive();
      $("main").innerHTML = `
        <div class="panel">
          <h2>🔬 New Diagnosis</h2>
          <p class="muted">Upload a clear, close-up photo of a single leaf.</p>
          <label class="drop" id="drop">
            <input type="file" id="imageInput" accept="image/png, image/jpeg" hidden>
            <div id="dropInner">
              <div class="drop-icon">📷</div>
              <b>Choose a photo</b>
              <span>or drag and drop it here (JPEG or PNG)</span>
            </div>
          </label>
          <button class="btn" id="goBtn" disabled>🔍 Diagnose</button>
          <div id="newMsg"></div>
        </div>`;

      const input = $("imageInput"), drop = $("drop");
      input.addEventListener("change", () => {
        const f = input.files[0];
        if (!f) return;
        $("dropInner").innerHTML = `<img class="pv" src="${URL.createObjectURL(f)}" alt="Selected leaf"><span>${esc(f.name)} · click to change</span>`;
        $("goBtn").disabled = false;
        $("newMsg").innerHTML = "";
      });
      ["dragenter","dragover"].forEach(t => drop.addEventListener(t, e => { e.preventDefault(); drop.classList.add("over"); }));
      ["dragleave","drop"].forEach(t => drop.addEventListener(t, e => { e.preventDefault(); drop.classList.remove("over"); }));
      drop.addEventListener("drop", e => {
        if (e.dataTransfer.files.length) {
          input.files = e.dataTransfer.files;
          input.dispatchEvent(new Event("change"));
        }
      });
      $("goBtn").addEventListener("click", diagnose);
    }

    async function diagnose() {
      const file = $("imageInput").files[0];
      const btn = $("goBtn"), msgEl = $("newMsg");
      if (!file) return;
      btn.disabled = true;
      msgEl.innerHTML = '<div class="typing">Analysing your leaf <div class="dots"><span></span><span></span><span></span></div></div>';
      try {
        const form = new FormData();
        form.append("file", file);
        const data = await api("/predict", { method: "POST", body: form });
        thumbs[data.record_id] = URL.createObjectURL(file);
        await loadHistory();
        await openRecord(data.record_id);
      } catch (e) {
        msgEl.innerHTML = '<div class="alert err">' + esc(e.message) + "</div>";
        btn.disabled = false;
      }
    }

    /* ---------- record / chat view ---------- */
    async function openRecord(id) {
      activeId = id;
      markActive();
      $("main").innerHTML = '<div class="wrap"><div class="typing">Loading <div class="dots"><span></span><span></span><span></span></div></div></div>';
      try {
        const [r, chatHistory] = await Promise.all([
          api("/predictions/" + id),
          api("/predictions/" + id + "/chat").catch(() => [])
        ]);
        $("main").innerHTML = renderRecord(r, chatHistory);
        $("main").scrollTop = $("main").scrollHeight;
        setupChatInput(r);
      } catch (e) {
        $("main").innerHTML = '<div class="wrap"><div class="alert err">' + esc(e.message) + "</div></div>";
      }
    }

    function listTile(title, icon, items) {
      if (!items || !items.length) return "";
      return `<div class="tile"><h4>${icon} ${title}</h4><ul>${items.map(i => "<li>" + esc(i) + "</li>").join("")}</ul></div>`;
    }

    function renderRecord(r, chatHistory) {
      const p = parseLabel(r.disease);
      const pct = (r.confidence * 100).toFixed(1);
      const unsure = r.status === "uncertain";
      const cls = unsure ? "lo" : confClass(r.confidence);
      const thumb = thumbs[r.id]
        ? `<img class="thumb" src="${thumbs[r.id]}" alt="Uploaded leaf">`
        : `<div class="thumb ph"><div>🍃<span>Photo not stored</span></div></div>`;

      let answer;
      if (unsure) {
        answer = `<div class="alert warn" style="margin-top:0"><b>I'm not sure about this one.</b><br>
            The model is not confident about this image. Please upload a clear, close-up photo of a single leaf.</div>
          <div class="conf" style="margin-top:14px"><div class="conf-bar"><i class="lo" style="width:${pct}%"></i></div>
            <span>Best guess: ${esc(p.disease)} (${esc(p.crop)}) · ${pct}%</span></div>`;
      } else {
        const e = r.explanation;
        let body = "";
        if (e) {
          const src = e.source === "llm" ? "AI model" : e.source === "knowledge_base" ? "built-in knowledge base" : "";
          body = `<p class="summary">${esc(e.summary)}</p>
            <div class="grid">
              ${listTile("Symptoms", "🔍", e.symptoms)}
              ${listTile("Causes", "🧪", e.causes)}
              ${listTile("Prevention", "🛡️", e.prevention)}
            </div>
            ${src ? `<p class="src">Explanation source: ${src}</p>` : ""}
            <button class="btn support-btn" id="supportBtn">🛒 Where to Buy Prevention Products</button>`;
        } else {
          body = '<p class="muted">No explanation is stored for this record.</p>';
        }
        answer = `<div class="crop">${esc(p.crop)}</div>
          <div class="dname">${esc(p.disease)}</div>
          <div class="conf"><div class="conf-bar"><i class="${cls}" style="width:${pct}%"></i></div><span>${pct}% confidence</span></div>
          ${body}`;
      }
      const note = r.note ? `<p class="note">📝 ${esc(r.note)}</p>` : "";

      // Render existing chat history
      let historyHtml = "";
      if (chatHistory && chatHistory.length) {
        historyHtml = chatHistory.map(m => {
          if (m.role === "user") {
            return `<div class="msg user"><div class="bubble me"><p style="margin:0;font-size:15px">${esc(m.content)}</p></div></div>`;
          } else {
            return `<div class="msg"><div class="bot-av">🌿</div><div class="bubble bot"><p style="margin:0;font-size:15px;line-height:1.6">${esc(m.content)}</p></div></div>`;
          }
        }).join("");
      }

      return `<div class="wrap">
        <div class="chat-head">
          <div><h2>Diagnosis #${r.id}</h2><span class="muted">${esc(fmt(r.created_at))}</span></div>
          <button class="btn ghost danger" data-del-main="${r.id}">🗑 Delete</button>
        </div>
        <div class="chat" id="chatFeed">
          <div class="msg user"><div class="bubble me">${thumb}<div class="cap">Leaf photo uploaded</div></div></div>
          <div class="msg"><div class="bot-av">🌿</div><div class="bubble bot">${answer}${note}</div></div>
          ${historyHtml}
        </div>
        <p class="disclaimer">General guidance only. Please consult a local agriculture officer for treatment advice.</p>
        ${!unsure ? '<div class="chat-input-area" id="chatInputArea"></div>' : ""}
      </div>`;
    }

    function setupChatInput(r) {
      const area = document.getElementById("chatInputArea");
      if (!area) return;

      // Support button handler
      const supportBtn = document.getElementById("supportBtn");
      if (supportBtn) {
        supportBtn.addEventListener("click", () => loadSupport(r.id));
      }

      area.innerHTML = `
        <div class="chat-input-box">
          <textarea id="chatTextarea" placeholder="Ask a follow-up question about this diagnosis…" rows="1"></textarea>
          <button class="chat-send-btn" id="chatSendBtn" title="Send">➤</button>
        </div>
        <p class="chat-hint">Ask about treatment, prevention, spread, safety, or anything else about this disease.</p>`;

      const textarea = document.getElementById("chatTextarea");
      const sendBtn = document.getElementById("chatSendBtn");

      textarea.addEventListener("input", () => {
        textarea.style.height = "auto";
        textarea.style.height = Math.min(textarea.scrollHeight, 120) + "px";
      });

      textarea.addEventListener("keydown", (e) => {
        if (e.key === "Enter" && !e.shiftKey) {
          e.preventDefault();
          sendChat(r.id);
        }
      });

      sendBtn.addEventListener("click", () => sendChat(r.id));
    }

    async function sendChat(recordId) {
      const textarea = document.getElementById("chatTextarea");
      const sendBtn = document.getElementById("chatSendBtn");
      const feed = document.getElementById("chatFeed");
      const msg = textarea.value.trim();
      if (!msg || !textarea || !sendBtn || !feed) return;

      // Add user bubble immediately
      textarea.value = "";
      textarea.style.height = "auto";
      sendBtn.disabled = true;
      feed.insertAdjacentHTML("beforeend",
        `<div class="msg user"><div class="bubble me"><p style="margin:0;font-size:15px">${esc(msg)}</p></div></div>`
      );

      // Add typing indicator
      const typingId = "typing_" + Date.now();
      feed.insertAdjacentHTML("beforeend",
        `<div class="msg" id="${typingId}"><div class="bot-av">🌿</div>
         <div class="bubble bot"><div class="typing" style="margin:0">Thinking <div class="dots"><span></span><span></span><span></span></div></div></div></div>`
      );
      $("main").scrollTop = $("main").scrollHeight;

      try {
        const data = await api("/predictions/" + recordId + "/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message: msg })
        });

        // Replace typing with reply
        const typingEl = document.getElementById(typingId);
        if (typingEl) {
          typingEl.outerHTML = `<div class="msg"><div class="bot-av">🌿</div>
            <div class="bubble bot"><p style="margin:0;font-size:15px;line-height:1.6">${esc(data.reply)}</p></div></div>`;
        }
      } catch (e) {
        const typingEl = document.getElementById(typingId);
        if (typingEl) {
          typingEl.outerHTML = `<div class="msg"><div class="bot-av">🌿</div>
            <div class="bubble bot"><div class="alert err" style="margin:0">${esc(e.message)}</div></div></div>`;
        }
      } finally {
        sendBtn.disabled = false;
        $("main").scrollTop = $("main").scrollHeight;
      }
    }

    async function loadSupport(recordId) {
      const supportBtn = document.getElementById("supportBtn");
      const feed = document.getElementById("chatFeed");
      if (!feed) return;
      if (supportBtn) supportBtn.disabled = true;

      // Add typing indicator
      const typingId = "typing_support_" + Date.now();
      feed.insertAdjacentHTML("beforeend",
        `<div class="msg" id="${typingId}"><div class="bot-av">🌿</div>
         <div class="bubble bot"><div class="typing" style="margin:0">Finding where to buy <div class="dots"><span></span><span></span><span></span></div></div></div></div>`
      );
      $("main").scrollTop = $("main").scrollHeight;

      try {
        const data = await api("/predictions/" + recordId + "/support");

        const productsHtml = data.recommended_products.length
          ? `<div class="products-row">${data.recommended_products.map(p => `<span class="product-tag">💊 ${esc(p)}</span>`).join("")}</div>`
          : "";

        const storesHtml = data.where_to_buy.map(s => {
          const typeClass = s.type === "Online" ? "online" : s.type === "Government" ? "gov" : "local";
          const typeIcon = s.type === "Online" ? "🛍️" : s.type === "Government" ? "🏛️" : "📍";
          const nameHtml = s.url
            ? `<a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.name)}</a>`
            : esc(s.name);
          return `<div class="store-item">
            <div class="store-icon">${typeIcon}</div>
            <div>
              <span class="store-type-badge ${typeClass}">${esc(s.type)}</span>
              <div class="store-name">${nameHtml}</div>
              <div class="store-note">${esc(s.note)}</div>
            </div>
          </div>`;
        }).join("");

        const supportHtml = `<div class="bubble bot support">
          <div class="crop" style="margin-bottom:8px">🛒 Where to Buy</div>
          <b style="font-size:16px">Prevention products for ${esc(data.disease_readable)}</b>
          ${productsHtml ? `<p style="font-size:13px;color:var(--muted);margin:8px 0 4px">Commonly recommended products:</p>${productsHtml}` : ""}
          <p style="font-size:13px;color:var(--muted);margin:14px 0 6px">Available from:</p>
          <div class="store-list">${storesHtml}</div>
          <div class="helpline">📞 ${esc(data.helpline)}</div>
          <p style="font-size:12px;color:var(--muted);margin-top:10px">⚠️ Always consult a local agriculture officer before buying or applying any product.</p>
        </div>`;

        const typingEl = document.getElementById(typingId);
        if (typingEl) {
          typingEl.outerHTML = `<div class="msg"><div class="bot-av">🌿</div>${supportHtml}</div>`;
        }
      } catch (e) {
        const typingEl = document.getElementById(typingId);
        if (typingEl) {
          typingEl.outerHTML = `<div class="msg"><div class="bot-av">🌿</div>
            <div class="bubble bot"><div class="alert err" style="margin:0">${esc(e.message)}</div></div></div>`;
        }
      } finally {
        $("main").scrollTop = $("main").scrollHeight;
      }
    }

    $("main").addEventListener("click", (ev) => {
      const b = ev.target.closest("[data-del-main]");
      if (b) deleteRecord(Number(b.dataset.delMain));
    });

    /* ---------- start ---------- */
    setMode("login");
    if (token) {
      api("/auth/me").then(me => enterApp(me.username)).catch(() => logout());
    } else {
      setView("login");
    }
  </script>
</body>
</html>
